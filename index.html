<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Keuangan - Maxton Enterprise</title>
    <!-- Library SheetJS untuk Export Excel (.xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header-brand {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 15px;
        }
        .brand-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #007bff;
            text-transform: uppercase;
            margin: 0 0 5px 0;
        }
        h2 {
            margin: 0;
            color: #1a2530;
            font-size: 24px;
        }
        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .input-field {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }
        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #007bff;
        }
        .btn-submit {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 16px;
        }
        .btn-submit:hover {
            background-color: #218838;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .btn-export {
            background-color: #17a2b8;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-export:hover {
            background-color: #138496;
        }
        .btn-clear {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-clear:hover {
            background-color: #c82333;
        }
        .btn-delete {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .masuk {
            color: #28a745;
            font-weight: bold;
        }
        .keluar {
            color: #dc3545;
            font-weight: bold;
        }
        .summary {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 10px;
        }
        .footer-brand {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Branding Header Maxton Enterprise -->
    <div class="header-brand">
        <p class="brand-title">MAXTON ENTERPRISE</p>
        <h2>Data Entry Laporan Keuangan</h2>
    </div>
    
    <!-- Form Input Data -->
    <form id="finance-form">
        <div class="form-group">
            <div class="input-field">
                <label for="tanggal">Tanggal</label>
                <input type="date" id="tanggal" required>
            </div>
            <div class="input-field">
                <label for="keterangan">Keterangan / Deskripsi</label>
                <input type="text" id="keterangan" placeholder="Contoh: Penjualan Produk A" required>
            </div>
            <div class="input-field">
                <label for="jenis">Jenis Transaksi</label>
                <select id="jenis" required>
                    <option value="Pemasukan">Pemasukan (+)</option>
                    <option value="Pengeluaran">Pengeluaran (-)</option>
                </select>
            </div>
            <div class="input-field">
                <label for="jumlah">Jumlah (Rp)</label>
                <input type="number" id="jumlah" placeholder="0" min="1" required>
            </div>
        </div>
        <button type="submit" class="btn-submit">Tambah Transaksi</button>
    </form>

    <!-- Ringkasan Saldo -->
    <div class="summary">
        <div>Total Pemasukan: <span id="total-pemasukan" class="masuk">Rp 0</span></div>
        <div>Total Pengeluaran: <span id="total-pengeluaran" class="keluar">Rp 0</span></div>
        <div>Saldo Akhir: <span id="saldo-akhir">Rp 0</span></div>
    </div>

    <!-- Tabel Data Keuangan -->
    <table id="data-table">
        <thead>
            <tr>
                <th>Tanggal</th>
                <th>Keterangan</th>
                <th>Jenis</th>
                <th>Jumlah</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data dari localStorage akan dirender di sini -->
        </tbody>
    </table>

    <div class="action-buttons">
        <button id="export-excel" class="btn-export">📊 Download Excel (.xlsx)</button>
        <button id="clear-all" class="btn-clear">🗑️ Hapus Semua Data</button>
    </div>

    <div class="footer-brand">
        &copy; Maxton Enterprise. All rights reserved.
    </div>
</div>

<script>
    const form = document.getElementById('finance-form');
    const tableBody = document.querySelector('#data-table tbody');
    const clearBtn = document.getElementById('clear-all');
    const exportBtn = document.getElementById('export-excel');

    // URL Web App Apps Script Anda
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz9E08XYmJ2zVKsfgfkruEUIvdaDusPINkNgUekaTtOz7bNXqoLLme-QHqjiETGqUgW/exec';

    // Ambil data dari localStorage atau set array kosong jika belum ada
    let transaksiList = JSON.parse(localStorage.getItem('transaksiKeuangan')) || [];

    // Set tanggal default ke hari ini
    document.getElementById('tanggal').valueAsDate = new Date();

    // Fungsi untuk memperbarui tampilan tabel dan statistik ringkasan
    function renderApp() {
        tableBody.innerHTML = '';
        let totalPemasukan = 0;
        let totalPengeluaran = 0;

        transaksiList.forEach((item, index) => {
            const jumlah = parseFloat(item.jumlah);
            if (item.jenis === 'Pemasukan') {
                totalPemasukan += jumlah;
            } else {
                totalPengeluaran += jumlah;
            }

            const row = document.createElement('tr');
            const jenisClass = item.jenis === 'Pemasukan' ? 'masuk' : 'keluar';

            row.innerHTML = `
                <td>${item.tanggal}</td>
                <td>${item.keterangan}</td>
                <td class="${jenisClass}">${item.jenis}</td>
                <td>Rp ${jumlah.toLocaleString('id-ID')}</td>
                <td><button class="btn-delete" onclick="hapusTransaksi(${index})">Hapus</button></td>
            `;
            tableBody.appendChild(row);
        });

        const saldoAkhir = totalPemasukan - totalPengeluaran;

        // Update tampilan teks di ringkasan
        document.getElementById('total-pemasukan').innerText = `Rp ${totalPemasukan.toLocaleString('id-ID')}`;
        document.getElementById('total-pengeluaran').innerText = `Rp ${totalPengeluaran.toLocaleString('id-ID')}`;
        document.getElementById('saldo-akhir').innerText = `Rp ${saldoAkhir.toLocaleString('id-ID')}`;

        // Simpan array terbaru ke localStorage
        localStorage.setItem('transaksiKeuangan', JSON.stringify(transaksiList));
    }

    // Eventlistener saat form di-submit
    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const submitBtn = form.querySelector('.btn-submit');
        submitBtn.disabled = true;
        submitBtn.innerText = 'Menyimpan & Mengirim...';

        const tanggal = document.getElementById('tanggal').value;
        const keterangan = document.getElementById('keterangan').value;
        const jenis = document.getElementById('jenis').value;
        const jumlah = document.getElementById('jumlah').value;

        // 1. Simpan ke Tampilan Lokal (LocalStorage)
        transaksiList.push({ tanggal, keterangan, jenis, jumlah });
        renderApp();

        // 2. Kirim Data ke Google Sheets via Apps Script
        const payloadData = {
            tanggal: tanggal,
            keterangan: keterangan,
            jenis: jenis,
            jumlah: jumlah
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payloadData)
        })
        .then(() => {
            alert('Berhasil! Data tersimpan di web & terkirim ke Google Sheets.');
            document.getElementById('keterangan').value = '';
            document.getElementById('jumlah').value = '';
        })
        .catch(error => {
            console.error('Error Google Sheets:', error);
            alert('Data tersimpan lokal, namun gagal terkirim ke Google Sheets.');
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Tambah Transaksi';
        });
    });

    // Fungsi menghapus baris transaksi tertentu
    function hapusTransaksi(index) {
        transaksiList.splice(index, 1);
        renderApp();
    }

    // Tombol untuk menghapus seluruh data
    clearBtn.addEventListener('click', function() {
        if (confirm('Apakah Anda yakin ingin menghapus seluruh data transaksi?')) {
            transaksiList = [];
            localStorage.removeItem('transaksiKeuangan');
            renderApp();
        }
    });

    // Fungsi untuk Export Data ke Excel (.xlsx)
    exportBtn.addEventListener('click', function() {
        if (transaksiList.length === 0) {
            alert('Belum ada data transaksi untuk di-download!');
            return;
        }

        let excelData = [];
        let totalPemasukan = 0;
        let totalPengeluaran = 0;

        transaksiList.forEach(item => {
            const nominal = parseFloat(item.jumlah);
            if (item.jenis === 'Pemasukan') {
                totalPemasukan += nominal;
            } else {
                totalPengeluaran += nominal;
            }

            excelData.push({
                'Tanggal': item.tanggal,
                'Keterangan': item.keterangan,
                'Jenis Transaksi': item.jenis,
                'Jumlah (Rp)': nominal
            });
        });

        excelData.push({});
        excelData.push({ 'Keterangan': 'TOTAL PEMASUKAN', 'Jumlah (Rp)': totalPemasukan });
        excelData.push({ 'Keterangan': 'TOTAL PENGELUARAN', 'Jumlah (Rp)': totalPengeluaran });
        excelData.push({ 'Keterangan': 'SALDO AKHIR', 'Jumlah (Rp)': totalPemasukan - totalPengeluaran });

        const worksheet = XLSX.utils.json_to_sheet(excelData);
        worksheet['!cols'] = [
            { wch: 15 },
            { wch: 30 },
            { wch: 18 },
            { wch: 18 }
        ];

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Laporan Keuangan");

        const today = new Date().toISOString().split('T')[0];
        XLSX.writeFile(workbook, `Laporan_Keuangan_Maxton_${today}.xlsx`);
    });

    // Render data pertama kali saat halaman di-load
    renderApp();
</script>

</body>
</html>
